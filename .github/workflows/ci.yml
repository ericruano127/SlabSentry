name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan (npm)
        run: pnpm audit --audit-level=high --prod
      - run: pnpm --filter @slabguard/core test && pnpm -r typecheck
      - run: |
          cd services/vision && python -m venv .venv && .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pip-audit && .venv/bin/pip-audit -r requirements.txt --strict
          .venv/bin/python -m pytest -q
          .venv/bin/python -m tests.make_fixtures /tmp/fixtures
          (.venv/bin/uvicorn app.main:app --port 8001 &) && sleep 5
      - run: pnpm --filter @slabguard/web test
        env: { FIXTURES_DIR: /tmp/fixtures, TEST_DATABASE_URL: "postgres://postgres@localhost:5432/slabguard_test" }
  images:
    # Proves both production images build on every push (they can't be built in the dev sandbox).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web/worker image
        run: docker build -f Dockerfile.web -t slabsentry-web:ci --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder .
      - name: Build vision image
        run: docker build -t slabsentry-vision:ci services/vision
      - name: Smoke-test vision image (non-root, health answers)
        run: |
          docker run -d --name v -p 8001:8001 -e VISION_WARMUP=0 slabsentry-vision:ci
          for i in $(seq 1 30); do curl -sf localhost:8001/health && break; sleep 1; done
          test "$(docker exec v id -u)" != "0"

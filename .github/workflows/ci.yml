name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis: # exercises the shared (multi-instance) rate limiter
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan (npm)
        run: pnpm audit --audit-level=high --prod
      - name: Migration safety (blue-green compatible)
        run: node apps/web/scripts/check-migrations.mjs
      - run: pnpm --filter @slabguard/core test && pnpm -r typecheck
      - run: |
          cd services/vision && python -m venv .venv && .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pip-audit && .venv/bin/pip-audit -r requirements.txt --strict
          .venv/bin/python -m pytest -q
          .venv/bin/python -m tests.make_fixtures /tmp/fixtures
          (.venv/bin/uvicorn app.main:app --port 8001 &) && sleep 5
      - run: pnpm --filter @slabguard/web test
        env: { FIXTURES_DIR: /tmp/fixtures, TEST_DATABASE_URL: "postgres://postgres@localhost:5432/slabguard_test" }
  images:
    # Proves both production images build on every push (they can't be built in the dev sandbox).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build web/worker image
        run: docker build -f Dockerfile.web -t slabsentry-web:ci --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder .
      - name: Smoke-test worker image start-up (telemetry preload + modules resolve)
        run: |
          docker run --rm -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 -e OTEL_METRICS_EXPORTER=none slabsentry-web:ci \
            node --import ./apps/web/scripts/otel-preload.mjs -e "console.log('preload ok')"
      - name: Build vision image
        run: docker build -t slabsentry-vision:ci services/vision
      - name: Smoke-test vision image (non-root, health answers)
        run: |
          docker run -d --name vision-ci -p 8001:8001 slabsentry-vision:ci
          ok=""
          for i in $(seq 1 60); do curl -sf localhost:8001/health && { ok=1; break; }; sleep 2; done
          [ -n "$ok" ] || { docker logs vision-ci; echo "::error::vision health never answered"; exit 1; }
          uid="$(docker exec vision-ci id -u)"; echo "runs as uid $uid"; test "$uid" != "0"
  accessibility:
    # WCAG 2.2 A/AA (axe-core) + keyboard walk on every page, light/dark, desktop/phone, signed out/in/staff.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_a11y }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/slabguard_a11y
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slabguard/web db:migrate
      - run: pnpm --filter @slabguard/web exec playwright install --with-deps chromium
      - name: Start the app (development mode, test sign-in)
        run: |
          (cd apps/web && nohup npx next dev -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:3000/api/health && break; sleep 2; done
      - name: Accessibility audit
        working-directory: apps/web
        run: node scripts/a11y-audit.mjs --make-admin
      - if: failure()
        run: tail -100 /tmp/next.log
  e2e:
    # Browser end-to-end tests of the main flows: sign up, scan → report → share, out of credits, plans, account.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_e2e }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/slabguard_e2e
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
      LOCAL_STORAGE_DIR: /tmp/e2e-uploads # outside the app folder (the dev server reloads on file changes)
      FIXTURES_DIR: /tmp/fixtures
      E2E_OUT: /tmp/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: services/vision/requirements.txt }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slabguard/web db:migrate
      - name: Test Stripe price ids (checkout is stubbed in the tests; set before the app caches plans)
        run: psql "$DATABASE_URL" -c "update subscription_prices set stripe_price_id = 'price_e2e_' || id where stripe_price_id is null"
      - name: Start the vision service and make test photos
        working-directory: services/vision
        run: |
          python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m tests.make_fixtures /tmp/fixtures
          nohup .venv/bin/uvicorn app.main:app --port 8001 > /tmp/vision.log 2>&1 &
      - run: pnpm --filter @slabguard/web exec playwright install --with-deps chromium
      - name: Start the app (development mode, test sign-in)
        run: |
          (cd apps/web && nohup npx next dev -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:3000/api/health && break; sleep 2; done
          for i in $(seq 1 60); do curl -sf localhost:8001/health && break; sleep 2; done
          # Compile the pages once so the first tests don't wait on development-mode compilation.
          for p in / /signup /scan /pricing /dashboard /history /account; do curl -s -o /dev/null "localhost:3000$p"; done
      - name: Browser tests
        working-directory: apps/web
        run: pnpm exec playwright test
      - if: failure()
        run: tail -100 /tmp/next.log; tail -50 /tmp/vision.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: e2e-report, path: /tmp/e2e-out, retention-days: 7 }

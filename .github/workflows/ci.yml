name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis: # exercises the shared (multi-instance) rate limiter
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability scan (npm)
        run: pnpm audit --audit-level=high --prod
      - name: Migration safety (blue-green compatible)
        run: node apps/web/scripts/check-migrations.mjs
      - run: pnpm --filter @slabguard/core test && pnpm -r typecheck
      - run: |
          cd services/vision && python -m venv .venv && .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pip-audit && .venv/bin/pip-audit -r requirements.txt --strict
          .venv/bin/python -m pytest -q
          .venv/bin/python -m tests.make_fixtures /tmp/fixtures
          (.venv/bin/uvicorn app.main:app --port 8001 &) && sleep 5
      - run: pnpm --filter @slabguard/web test
        env: { FIXTURES_DIR: /tmp/fixtures, TEST_DATABASE_URL: "postgres://postgres@localhost:5432/slabguard_test" }
  images:
    # Proves both production images build on every push (they can't be built in the dev sandbox).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web/worker image
        run: docker build -f Dockerfile.web -t slabsentry-web:ci --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder .
      - name: Smoke-test worker image start-up (telemetry preload + modules resolve)
        run: |
          docker run --rm -e OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 -e OTEL_METRICS_EXPORTER=none slabsentry-web:ci \
            node --import ./apps/web/scripts/otel-preload.mjs -e "console.log('preload ok')"
      - name: Build vision image
        run: docker build -t slabsentry-vision:ci services/vision
      - name: Smoke-test vision image (non-root, health answers)
        run: |
          docker run -d --name vision-ci -p 8001:8001 slabsentry-vision:ci
          ok=""
          for i in $(seq 1 60); do curl -sf localhost:8001/health && { ok=1; break; }; sleep 2; done
          [ -n "$ok" ] || { docker logs vision-ci; echo "::error::vision health never answered"; exit 1; }
          uid="$(docker exec vision-ci id -u)"; echo "runs as uid $uid"; test "$uid" != "0"
  accessibility:
    # WCAG 2.2 A/AA (axe-core) + keyboard walk on every page, light/dark, desktop/phone, signed out/in/staff.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: slabguard_a11y }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/slabguard_a11y
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slabguard/web db:migrate
      - run: pnpm --filter @slabguard/web exec playwright install --with-deps chromium
      - name: Start the app (development mode, test sign-in)
        run: |
          (cd apps/web && nohup npx next dev -p 3000 > /tmp/next.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf localhost:3000/api/health && break; sleep 2; done
      - name: Accessibility audit
        working-directory: apps/web
        run: node scripts/a11y-audit.mjs --make-admin
      - if: failure()
        run: tail -100 /tmp/next.log
